name: Kwork_Monitor
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests beautifulsoup4
      - run: python script.py
      - run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Kwork Bot"
          git add sent_ids.txt last_status.txt || true
          git commit -m "Update DB" || exit 0
          git push
