name: Kwork_Monitor
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Script
        run: python script.py

      - name: Save changes
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Kwork Bot"
          git add sent_ids.txt last_status.txt || true
          git commit -m "Update DB" || exit 0
          git push
